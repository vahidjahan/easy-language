name: Deploy Le Français Est Facile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install, build, and test API
        run: npm ci --prefix api && npm test --prefix api

      - name: Remove development dependencies
        run: npm prune --prefix api --omit=dev

      - name: Deploy Function App
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656
        with:
          app-name: func-lfe-ykintg3juy3q
          package: api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          respect-funcignore: true

  deploy-frontend:
    needs: deploy-api
    runs-on: ubuntu-latest
    env:
      VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
      VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY }}
      VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}
      VITE_API_BASE_URL: https://func-lfe-ykintg3juy3q.azurewebsites.net/api
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate frontend configuration
        run: |
          for name in VITE_ENTRA_CLIENT_ID VITE_ENTRA_AUTHORITY VITE_ENTRA_API_SCOPE VITE_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable: $name"
              exit 1
            fi
          done

      - name: Build frontend
        run: npm ci --prefix web && npm run build --prefix web

      - name: Deploy Static Web App
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
